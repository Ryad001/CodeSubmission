<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid-bg"></div>
  <div class="vignette"></div>

  <div class="main-wrapper">
    <div class="logo-container">
      <img src="xcd.png" onerror="this.onerror=null; this.src='logo.png';" alt="International Academy of Iraq">
    </div>

    <div class="card center" id="loading-screen">
      <h2>System status</h2>
      <p class="msg">Checking uplink with server...</p>
    </div>

    <div class="card center" id="offline-screen" hidden>
      <h2>Portal closed</h2>
      <p class="msg">The exam portal is currently offline.<br>Please wait for the teacher to open it.</p>
    </div>

    <div class="card" id="portal" hidden>
      <h2>Exam portal</h2>
      <form id="portal-form" autocomplete="off">
        <div class="form-group">
          <select id="grade" required>
            <option value="" disabled selected>Select your grade</option>
            <option value="4">Grade 4</option>
            <option value="5">Grade 5</option>
            <option value="6">Grade 6</option>
            <option value="7">Grade 7</option>
            <option value="8">Grade 8</option>
            <option value="9">Grade 9</option>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>
        <div class="form-group">
          <input type="text" id="code" class="code-input" placeholder="Exam code" required>
        </div>
        <button type="submit">Start exam</button>
      </form>
      <p id="status" role="alert"></p>
    </div>
  </div>

  <footer class="designer-footer">
    Created by <span>Ryad Amghar</span><br>ICT Teacher &amp; Technical Support
  </footer>

  <script src="exams.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    // Is the portal open? (same Apps Script check as before)
    (async () => {
      try {
        const res = await fetch(SCRIPT_URL + "?action=status");
        const data = await res.json();
        $("loading-screen").hidden = true;
        if (data && data.status && data.status.toLowerCase().trim() === "online") {
          $("portal").hidden = false;
        } else {
          $("offline-screen").hidden = false;
        }
      } catch (e) {
        $("loading-screen").hidden = true;
        $("offline-screen").hidden = false;
        $("offline-screen").innerHTML = "<h2>Connection failed</h2><p class='msg'>Unable to reach the server. Tell your teacher.</p>";
      }
    })();

    $("portal-form").addEventListener("submit", e => {
      e.preventDefault();
      const grade = $("grade").value;
      const typed = $("code").value.trim().toUpperCase();
      const exam = EXAMS[grade];
      const status = $("status");

      if (!exam) {
        status.textContent = "This grade has no exam open yet. Check with your teacher.";
        status.className = "err";
        return;
      }

      if (typed === exam.accessCode.toUpperCase()) {
        sessionStorage.setItem("examGrade", grade);
        location.href = (exam.page || "exam.html") + "?grade=" + grade;
      } else {
        status.textContent = "Wrong code for this grade. Check it and try again.";
        status.className = "err";
        $("code").select();
      }
    });
  </script>
</body>
</html>
